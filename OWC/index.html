<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Web Components</title>
    <style>
      * { box-sizing: border-box; }
      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        padding: 2rem;
        font-family: sans-serif;
        color: #fff;
      }
      h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
      h2 { margin: 2rem 0 0.75rem; font-size: 1rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    </style>
  </head>
  <body>

    <h1>Open Web Components</h1>
    <p style="opacity:0.7;margin:0 0 2rem">Glassmorphism component library</p>

    <!-- o-button -->
    <h2>o-button</h2>
    <div class="row">
      <o-button>Click me</o-button>
      <o-button>Save</o-button>
      <o-button>Cancel</o-button>
    </div>

    <!-- o-panel -->
    <h2>o-panel (drag the ⠿ handle)</h2>
    <div class="row">
      <o-panel move>
        <strong>Draggable panel</strong>
        <p style="margin:8px 0 0;opacity:0.8">Grab the handle to move me around.</p>
      </o-panel>
      <o-panel>
        <strong>Static panel</strong>
        <p style="margin:8px 0 0;opacity:0.8">No move attribute.</p>
      </o-panel>
    </div>

    <!-- o-toast -->
    <h2>o-toast</h2>
    <div class="row">
      <o-button id="btn-success">Success</o-button>
      <o-button id="btn-error">Error</o-button>
      <o-button id="btn-warning">Warning</o-button>
      <o-button id="btn-info">Info</o-button>
      <o-button id="btn-long">8s toast</o-button>
    </div>

    <!-- o-table -->
    <h2>o-table</h2>
    <o-table id="demo-table" storage="local" storage-key="owc-demo-table"></o-table>
    <script type="module">
      import '/src/table.ts'
      const t = document.getElementById('demo-table')
      t.columns = [
        { key: 'name',  label: 'Name',  width: 160, sortable: true },
        { key: 'role',  label: 'Role',  width: 140, sortable: true },
        { key: 'score', label: 'Score', width: 90,  sortable: true, minWidth: 60 },
      ]
      t.data = [
        { name: 'Alice', role: 'Engineer', score: 92 },
        { name: 'Bob',   role: 'Designer', score: 85 },
        { name: 'Carol', role: 'Manager',  score: 78 },
        { name: 'Dave',  role: 'Engineer', score: 95 },
      ]
    </script>

    <!-- o-toggle -->
    <h2>o-toggle</h2>
    <div class="row">
      <o-toggle id="demo-toggle" options="Day,Week,Month"></o-toggle>
      <o-toggle options="S,M,L,XL" value="m"></o-toggle>
    </div>
    <script type="module">
      import '/src/toggle.ts'
      document.getElementById('demo-toggle').addEventListener('o-change', e => {
        console.log('toggle changed:', e.detail)
      })
    </script>

    <!-- Combined: o-search + o-table + pagination -->
    <h2>Search + Table</h2>
    <o-search id="demo-search" placeholder="Search people..." no-dropdown style="max-width:500px"></o-search>

    <div style="margin-top:12px">
      <o-table id="demo-table2" selectable></o-table>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
      <o-button id="btn-prev">‹</o-button>
      <o-toggle id="tgl-pages" options="1"></o-toggle>
      <o-button id="btn-next">›</o-button>
      <div style="flex:1"></div>
      <o-toggle id="tgl-pagesize" options="5,10,25,All" value="10"></o-toggle>
    </div>

    <script type="module">
      import '/src/search.ts'
      import '/src/table.ts'
      import '/src/toggle.ts'

      const COLUMNS = [
        { key: 'name',       label: 'Name',       width: 160 },
        { key: 'company',    label: 'Company',     width: 200 },
        { key: 'department', label: 'Department',  width: 140 },
        { key: 'age',        label: 'Age',         width: 60  },
      ]

      const search    = document.getElementById('demo-search')
      const table     = document.getElementById('demo-table2')
      const btnPrev   = document.getElementById('btn-prev')
      const btnNext   = document.getElementById('btn-next')
      const tglPages  = document.getElementById('tgl-pages')
      const tglSize   = document.getElementById('tgl-pagesize')

      table.columns = COLUMNS

      let allData      = []
      let filteredData = []
      let currentPage  = 1
      let pageSize     = 10

      function getPageSize() {
        return tglSize.value === 'all' ? Infinity : parseInt(tglSize.value)
      }

      function totalPages() {
        if (pageSize === Infinity) return 1
        return Math.max(1, Math.ceil(filteredData.length / pageSize))
      }

      function updatePageToggle() {
        const n = totalPages()
        tglPages.options = Array.from({ length: n }, (_, i) => String(i + 1))
        tglPages.value = String(currentPage)
      }

      function updateNavButtons() {
        const disabled = 'opacity:0.35;pointer-events:none'
        const enabled  = ''
        btnPrev.style.cssText = currentPage <= 1 ? disabled : enabled
        btnNext.style.cssText = currentPage >= totalPages() ? disabled : enabled
      }

      function render() {
        const start = pageSize === Infinity ? 0 : (currentPage - 1) * pageSize
        const end   = pageSize === Infinity ? filteredData.length : start + pageSize
        table.data  = filteredData.slice(start, end)
        updatePageToggle()
        updateNavButtons()
      }

      function applySearch(query) {
        const q = query.toLowerCase()
        filteredData = q
          ? allData.filter(r =>
              r.name.toLowerCase().includes(q) ||
              r.company.toLowerCase().includes(q) ||
              r.department.toLowerCase().includes(q)
            )
          : allData
        currentPage = 1
        render()
      }

      // Fetch data
      fetch('https://dummyjson.com/users?limit=50')
        .then(r => r.json())
        .then(({ users }) => {
          allData = users.map(u => ({
            name:       `${u.firstName} ${u.lastName}`,
            company:    u.company.name,
            department: u.company.department,
            age:        u.age,
          }))
          filteredData = allData
          render()
        })
        .catch(err => console.error('Failed to load users', err))

      search.addEventListener('o-input', e => applySearch(e.detail.query))

      tglPages.addEventListener('o-change', e => {
        currentPage = parseInt(e.detail.value)
        render()
      })

      tglSize.addEventListener('o-change', () => {
        pageSize = getPageSize()
        currentPage = 1
        render()
      })

      btnPrev.addEventListener('o-click', () => {
        if (currentPage > 1) { currentPage--; render() }
      })

      btnNext.addEventListener('o-click', () => {
        if (currentPage < totalPages()) { currentPage++; render() }
      })

      table.addEventListener('o-row-select', e => {
        console.log('selected rows:', e.detail.selected)
      })
    </script>

    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      import { toast } from '/src/toast.ts'
      window.toast = toast

      document.getElementById('btn-success').addEventListener('o-click', () => toast('File saved successfully!', 'success'))
      document.getElementById('btn-error').addEventListener('o-click', () => toast('Connection failed', 'error'))
      document.getElementById('btn-warning').addEventListener('o-click', () => toast('Low disk space', 'warning'))
      document.getElementById('btn-info').addEventListener('o-click', () => toast('Update available', 'info'))
      document.getElementById('btn-long').addEventListener('o-click', () => toast('Long toast — 8 seconds', 'info', { duration: 8000 }))
    </script>
  </body>
</html>
