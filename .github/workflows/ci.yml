name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: cd OWC && bun install

      - name: Type check
        run: cd OWC && npx tsc --noEmit

      - name: Test
        run: cd OWC && bun run test

      - name: Build CDN bundle
        run: cd OWC && bun run build:cdn
